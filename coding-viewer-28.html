<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Viewer – HTML CSS JS</title>
<style>
:root{--bg:#f3f5f9;--pn:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#dde1e8;--ac:#3b6cf6;
--cm:#7a8599;--st:#0a7d4b;--nu:#b45309;--kw:#8e3bd1;--fn:#1e5fd6;--cl:#b4236b;--at:#0e7490;--tg:#c2342b;--pc:#6b7385;--fs:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--pn:#161a23;--tx:#dfe4ee;--mu:#8a93a6;--bd:#2a3040;--ac:#6d93ff;--cm:#6d778c;--st:#7fd9a3;--nu:#f3b46b;--kw:#c79bff;--fn:#7cb0ff;--cl:#ff8fc0;--at:#6fd3e8;--tg:#ff8a80;--pc:#8a93a6}}
:root[data-theme="dark"]{--bg:#0e1118;--pn:#161a23;--tx:#dfe4ee;--mu:#8a93a6;--bd:#2a3040;--ac:#6d93ff;--cm:#6d778c;--st:#7fd9a3;--nu:#f3b46b;--kw:#c79bff;--fn:#7cb0ff;--cl:#ff8fc0;--at:#6fd3e8;--tg:#ff8a80;--pc:#8a93a6}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:16px;margin:0 auto 0 0}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#sz{width:80px;accent-color:var(--ac)}
main{flex:1;min-height:0;display:flex}main.v{flex-direction:column}
#ep{flex:0 0 var(--sz,50%);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pn)}
#tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--bd);align-items:center}
#tabs .tb{border-radius:8px 8px 0 0;font-weight:600}
#tabs .tb.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.sp{flex:1}
#eds{flex:1;position:relative;min-height:0}
.ed{position:absolute;inset:0}
.ed pre,.ed textarea{position:absolute;inset:0;margin:0;padding:10px;border:0;box-sizing:border-box;font:var(--fs)/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:2;letter-spacing:0;word-spacing:0}
.ed pre{overflow:hidden;pointer-events:none;color:var(--tx)}
.ed textarea{background:transparent;color:transparent;caret-color:var(--tx);resize:none;outline:0;overflow:auto}
.ed textarea::selection{background:rgba(109,147,255,.35)}
#dv{flex:none;width:12px;background:var(--bd);cursor:col-resize;touch-action:none;position:relative}
main.v #dv{width:auto;height:12px;cursor:row-resize}
#dv::after{content:"";position:absolute;inset:0;margin:auto;width:4px;height:36px;border-radius:2px;background:var(--mu)}
main.v #dv::after{width:36px;height:4px}
#dv:hover,#dv.drag{background:var(--ac)}
main.drag iframe{pointer-events:none}
main.v #rp{order:1}main.v #dv{order:2}main.v #ep{order:3}
#rp{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pn)}
#rh{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd);font-weight:600}
#live{font-weight:400;font-size:12px;color:var(--st);margin-right:auto}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);position:relative}
#ph{position:relative;flex:none}
#bz{position:absolute;left:0;top:0;transform-origin:0 0;box-sizing:border-box;padding:26px 12px 22px;background:#15171c;border-radius:44px;box-shadow:0 0 0 2px #2b2f38,0 10px 30px rgba(0,0,0,.35)}
#bz::before{content:"";position:absolute;top:10px;left:50%;width:56px;height:6px;margin-left:-28px;border-radius:3px;background:#2e323c}
#bz::after{content:"";position:absolute;bottom:7px;left:50%;width:90px;height:5px;margin-left:-45px;border-radius:3px;background:#3a3f4b}
#bz.full{position:static;padding:0;border-radius:0;box-shadow:none;background:none;width:100%;height:100%;transform:none}
#bz.full::before,#bz.full::after{display:none}
#pv{display:block;width:100%;height:100%;border:0;background:#fff;min-height:0;border-radius:30px}
#bz.full #pv{border-radius:0}
#rh{flex-wrap:wrap}
#dev{font:inherit;font-size:12px;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px 6px;max-width:150px}
#dinfo{font-weight:400;font-size:11px;color:var(--mu)}
#ep{flex:1!important}
#dv{display:none!important}
#rp{position:fixed;flex:none;z-index:20;border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden;background:var(--pn)}
#rp.drag iframe{pointer-events:none}
#rh{cursor:move;touch-action:none;user-select:none;-webkit-user-select:none;padding:5px 8px;gap:5px;font-size:13px}
#rh button{cursor:pointer;padding:3px 8px}
#live{display:none}
#dinfo{margin-right:auto}
#rz{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:5;background:linear-gradient(135deg,transparent 55%,var(--mu) 55%,var(--mu) 62%,transparent 62%,transparent 72%,var(--mu) 72%,var(--mu) 79%,transparent 79%)}
#bLive{font-weight:600}
#con{position:fixed;z-index:21;display:flex;flex-direction:column;background:#0f1218;color:#dfe4ee;border:1px solid #2a3040;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
#ch{display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:12px;color:#8a93a6;border-bottom:1px solid #222a38;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
#ch .ct{margin-right:auto;font-weight:600;color:#dfe4ee}
#ch button{padding:2px 8px;font-size:12px;background:transparent;color:#8a93a6;border-color:#2a3040}
#cl{flex:1;min-height:0;overflow:auto;padding:4px 10px;font:var(--cfs,12.5px) ui-monospace,Menlo,Consolas,monospace}
#cz{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:5;background:linear-gradient(135deg,transparent 55%,#8a93a6 55%,#8a93a6 62%,transparent 62%,transparent 72%,#8a93a6 72%,#8a93a6 79%,transparent 79%)}
#ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#cl div{padding:3px 0;border-bottom:1px solid #1d2432;white-space:pre-wrap;word-break:break-word}
#cl .warn{color:#f3b46b}#cl .error{color:#ff8a80}
.cm{color:var(--cm);font-style:italic}.st{color:var(--st)}.nu{color:var(--nu)}.kw{color:var(--kw);font-weight:600}.fn{color:var(--fn)}.cl{color:var(--cl)}.at{color:var(--at)}.tg{color:var(--tg)}.pn{color:var(--pc)}
#set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--pn);border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
#bSet{padding:2px 8px;font-size:12px}
#bCon{margin-left:auto;padding:2px 8px;font-size:12px}
footer{align-items:center;padding:4px 12px;font-size:12px;color:var(--mu);background:var(--pn);border-top:1px solid var(--bd);display:flex;gap:14px}
.errl{background:rgba(229,72,77,.2);box-shadow:inset 3px 0 #e5484d}
#errbar{padding:6px 10px;background:#fdecea;color:#b3261e;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f5c2c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#errbar.warn{background:#fff6e0;color:#8a5a00;border-color:#f3dca0}
#kb{flex:none;background:var(--pn);border-top:1px solid var(--bd)}
#chips{display:flex;gap:4px;overflow-x:auto;padding:4px 8px;border-bottom:1px solid var(--bd);scrollbar-width:none}
#keys{display:flex;gap:4px;overflow-x:auto;padding:5px 8px;scrollbar-width:none;align-items:center}
#keys button{flex:none;min-width:34px;padding:7px 10px;font:15px ui-monospace,Menlo,Consolas,monospace;touch-action:manipulation}
#keys .tg2{font-size:13px;font-family:inherit;font-weight:600;border-color:var(--ac);color:var(--ac)}
#keys .tg2.on{background:var(--ac);color:#fff}
#chips button{flex:none;padding:3px 9px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
#chips .sn{color:var(--ac)}
#chips span{display:contents}#chips .sg{background:var(--ac);color:#fff;border-color:var(--ac)}
#fr{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--bd);align-items:center;font-size:12px;color:var(--mu)}
#fr input{flex:1;min-width:90px;font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
#fr button{padding:3px 8px;font-size:12px}
#cl .exc{border-left:3px solid #ff6b6b;background:#151a24;margin:6px 0;padding:8px 10px;border-radius:6px;border-bottom:0}
#cl .exc.lint{border-left-color:#f3b46b}
#cl .exc div{padding:0;border:0}
#cl .eh{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:#ff8a80}
#cl .exc.lint .eh{color:#f3b46b}
#cl .exc.note{border-left-color:#6d93ff}
#cl .exc.note .eh{color:#7cb0ff}
#cl .eh span{font-weight:400;color:#8a93a6}
#cl .et{margin:4px 0;color:#dfe4ee}
#cl .ef{margin:6px 0;padding:6px 8px;background:#0b0e14;border-radius:6px;overflow:auto;color:#c9d1e3;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
#cl .er{color:#8a93a6;font-size:11.5px}
#cl .ei{margin-top:4px;color:#7fd9a3}
#cl .exc button{margin-top:6px}
#help{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
#help .hb{background:var(--pn);color:var(--tx);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:14px 16px}
#help h3{margin:10px 0 6px;font-size:14px}
#help table{width:100%;border-collapse:collapse;font-size:13px}
#help td{padding:3px 6px;border-bottom:1px solid var(--bd)}
#help kbd,#help code{font:12px ui-monospace,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px}
#eds.wrap .ed pre,#eds.wrap .ed textarea{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;scrollbar-gutter:stable}
#mir{position:absolute;top:0;left:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none;border:0;margin:0;box-sizing:border-box}
#sg{position:absolute;z-index:6;display:none;min-width:150px;max-width:92%;max-height:190px;overflow:auto;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.28);font:13px ui-monospace,Menlo,Consolas,monospace}
#sg .si{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#sg .si.on{background:var(--ac);color:#fff}
#sg .si i{font-style:normal;opacity:.7;font-size:11px;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#sned{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:11;padding:12px}
#sned .hb{background:var(--pn);color:var(--tx);border-radius:12px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:14px 16px}
#sned h3{margin:4px 0 6px;font-size:14px}
#sned code{font:12px ui-monospace,monospace;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px}
.sr{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.sr input,.sr textarea{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 7px;box-sizing:border-box}
.sr input{width:92px;flex:none}
.sr textarea{flex:1;min-width:0;min-height:58px;resize:vertical;white-space:pre;tab-size:2}
.sr .sb{display:flex;flex-direction:column;gap:4px;flex:none}
.sr .sb button{padding:3px 8px;font-size:12px}
#sned .ba{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:flex-end}
#bKb.on,#bSc.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#rp.top{z-index:24}
#con.top{z-index:25}
#con.mx{left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;border:0;border-radius:0;box-shadow:none;z-index:31}
#con.mx #cz{display:none}
#con.mx #ch{cursor:default}
body.lmx #con{z-index:32}
body.lmx #con.mx{z-index:35}
#rp.mx{left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;border:0;border-radius:0;box-shadow:none;z-index:30}
#rp.mx #rz{display:none}
#rp.mx #rh{cursor:default}
#bMax.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ed{--gw:0px;inset:auto;top:var(--avt,0px);right:var(--avr,0px);bottom:var(--avb,0px);left:var(--avl,0px)}
#rp.fo{background:transparent;border:0;box-shadow:none;overflow:visible;border-radius:0}
#rp.fo #stage{background:transparent;overflow:visible}
#rp.fo #errbar,#rp.fo #dev,#rp.fo #dinfo,#rp.fo #live,#rp.fo #bRot{display:none!important}
#rp.fo #rh{position:absolute;top:-24px;right:0;left:auto;width:auto;flex-wrap:nowrap;border:0;border-radius:14px;background:rgba(20,24,35,.72);color:#fff;padding:1px 4px;gap:2px;font-size:0;z-index:7;opacity:.4;white-space:nowrap}
#rp.fo #rh::before{content:"⠿";font-size:14px;padding:0 3px}
#rp.fo #rh:hover,#rp.fo #rh:active,#rp.fo #rh.more{opacity:1}
#rp.fo #rh button{font-size:12px;padding:1px 6px;background:transparent;color:#fff;border-color:transparent}
#rp.fo #rh button.on{background:var(--ac)}
#rtab{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:44px;height:14px;border-radius:8px;background:rgba(120,130,150,.5);color:#fff;font-size:10px;line-height:14px;text-align:center;z-index:6;cursor:pointer;display:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#rp.ah #rtab{display:block}
#rp.fo #rtab{top:-16px;right:6px;left:auto;transform:none;width:30px}
#rp.ah:not(.fo) #rh{position:absolute;top:0;left:0;right:0;z-index:8;background:var(--pn);transition:opacity .18s}
#rp.ah #rh{transition:opacity .18s}
#rp.ah #rh.gone{opacity:0;pointer-events:none}
#bAh.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#rp.ah #rh:not(.gone)~#rtab{display:none!important}
#m.dk #rp.fo #rh,#rp.fo.mx #rh{top:4px;right:4px}
#m.dk #rp.fo #rtab,#rp.fo.mx #rtab{top:4px;right:6px}
#rp.mx #rh,#rp.mx #rtab{z-index:40}
#rh .sec{display:none}
#rh.more .sec{display:inline-block}
#rp.fo #rh .pri{display:none}
#rp.fo #rh.more .pri{display:inline-block}
#bMore.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#bFo.on,#bAv.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ed pre,.ed textarea{padding-left:calc(var(--gw) + 8px)}
.ed .gt{position:absolute;left:0;top:0;bottom:0;width:var(--gw);box-sizing:border-box;margin:0;padding:10px 6px 0 0;overflow:hidden;pointer-events:none;text-align:right;white-space:pre;background:var(--pn);border-right:1px solid var(--bd);color:var(--mu);font:var(--fs)/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;z-index:2;user-select:none;-webkit-user-select:none}
.ed .gt .ge{color:#e5484d;font-weight:700}
#gm{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none;margin:0;padding:0;border:0;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;height:0;overflow:hidden}
#m.dk #rp{position:relative;left:auto!important;top:auto!important;width:auto!important;height:auto!important;border-radius:0;border:0;box-shadow:none;z-index:auto;flex:0 0 calc(var(--dz,45) * 1%)!important}
#m.dk #rz{display:none}
#m.dk #rh{cursor:default}
#m.dk #dv{display:block!important}
#m.dkt,#m.dkb{flex-direction:column}
#m.dkr{flex-direction:row}
#m.dkt #rp{order:1}#m.dkt #dv{order:2}#m.dkt #ep{order:3}
#m.dkb #ep{order:1}#m.dkb #dv{order:2}#m.dkb #rp{order:3}
#m.dkr #ep{order:1}#m.dkr #dv{order:2}#m.dkr #rp{order:3}
#m.dkt #dv,#m.dkb #dv{width:auto;height:12px;cursor:row-resize}
#m.dkr #dv{width:12px;height:auto;cursor:col-resize}
#m.dkt #dv::after,#m.dkb #dv::after{width:36px;height:4px}
#m.dkr #dv::after{width:4px;height:36px}
#m.dkt #rp{border-bottom:1px solid var(--bd)}
#m.dkb #rp{border-top:1px solid var(--bd)}
#m.dkr #rp{border-left:1px solid var(--bd)}
#m.dk #rp.mx{position:fixed;flex:none!important;width:100vw!important;height:100vh!important;height:100dvh!important;border:0;z-index:30}
#bDock.on{background:var(--ac);color:#fff;border-color:var(--ac)}
footer{gap:8px!important}
footer button{white-space:nowrap;flex:none}
#sInfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#sMsg{white-space:nowrap}
#pv2{position:absolute;z-index:6;display:none;max-width:92%;min-width:160px;background:var(--pn);color:var(--tx);border:1px solid var(--ac);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.28);overflow:hidden;cursor:pointer}
#pv2 .ph{font-size:11px;padding:3px 8px;background:var(--ac);color:#fff}
#sbar{flex:none;background:var(--pn);border-top:1px solid var(--bd);margin-left:var(--avl,0px);margin-right:var(--avr,0px)}
#sbar #sg{position:static;display:none;flex-direction:row;gap:5px;padding:5px 8px;min-width:0;max-width:none;max-height:none;overflow-x:auto;overflow-y:hidden;border:0;border-radius:0;box-shadow:none;background:transparent;scrollbar-width:none;z-index:auto}
#sbar #sg .si{flex:none;border:1px solid var(--bd);border-radius:14px;padding:3px 11px;gap:8px}
#sbar #sg .si.on{border-color:var(--ac)}
#sbar #pv2{position:static;display:none;max-width:none;min-width:0;border:0;border-top:1px solid var(--bd);border-radius:0;box-shadow:none;z-index:auto}
#sbar #pv2 pre{max-height:min(26vh,190px)}
#pv2 pre{margin:0;padding:6px 10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:210px;overflow:auto;white-space:pre}
.hide{display:none!important}
</style>
</head>
<body>
<main id="m">
<section id="ep">
<div id="tabs">
<button class="tb" data-t="html">HTML</button><button class="tb" data-t="css">CSS</button><button class="tb" data-t="js">JS</button><span class="sp"></span><button id="bSc" title="Tampilkan / sembunyikan pintasan">⚡</button><button id="bKb" title="Tampilkan / sembunyikan keyboard simbol">⌨</button><button id="bLive" title="Tampilkan / sembunyikan live (Alt+L)">📱 Live</button>

</div>
<div id="fr" class="hide"><input id="fq" placeholder="Cari"><input id="frp" placeholder="Ganti dengan"><span id="fc"></span><button id="fP">↑</button><button id="fN">↓</button><button id="fR">Ganti</button><button id="fA">Semua</button><button id="fCase" title="Bedakan huruf besar/kecil">Aa</button><button id="fX">✕</button></div>
<div id="eds"></div>
<div id="sbar" class="hide"><div id="sg"></div><div id="pv2"></div></div>
<div id="kb"><div id="chips"><span id="chipbtns"></span></div><div id="keys"></div></div>
</section>
<div id="dv" title="Seret untuk mengatur ukuran (klik 2x = reset)"></div>
